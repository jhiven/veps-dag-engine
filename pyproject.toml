[project]
name = "nedo-vision-dag-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "jhiven", email = "jivenagnar11@gmail.com" }]
requires-python = ">=3.14"
dependencies = []

# [project.scripts]
# nedo-vision-dag-engine = "nedo_vision_dag_engine:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "strict"

[dependency-groups]
benchmark = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "psutil>=6.0.0",
    "scipy>=1.18.0",
]
dev = ["pytest>=9.1.1", "scipy-stubs>=1.18.0.1"]
realworld-video = [
    "numpy>=2.5.1",
    "torch>=2.6.0",
    "torchvision",
    "transformers>=4.49.0",
]

[tool.pytest.ini_options]
addopts = "-v --showlocals"
testpaths = ["tests"]
